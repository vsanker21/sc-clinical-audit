[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-clinical-audit"
version = "2.0.0"
description = "scClinicalAudit: field benchmark for single-cell clinical-label prediction under confounding"
readme = "README-scClinicalAudit.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanker, V.", email = "user@tnomics.local" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "torch>=2.0",
  "torch-geometric>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sc-clinical-audit = "sc_clinical_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
